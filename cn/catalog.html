<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07060a">
    <title>全部书库 · 马克书库</title>
    <meta name="keywords" content="全品类书库,网文,评分,简介">
    <meta name="description" content="按分类浏览书名、作者、评分、评分人数和简介。">
    <link rel="shortcut icon" href="../assets/images/favicon.png">
    <link rel="stylesheet" href="../assets/css/theme.css">
</head>

<body class="page-body dl-site">
    <div class="page-container">
        <div class="sidebar-menu toggle-others fixed">
            <div class="sidebar-menu-inner">
                <header class="logo-env">
                    <div class="logo">
                        <a href="index.html" class="logo-expanded"></a>
                    </div>
                    <div class="mobile-menu-toggle visible-xs">
                        <a href="#" data-toggle="mobile-menu" aria-label="菜单"></a>
                    </div>
                </header>
                <ul id="main-menu" class="main-menu"></ul>
            </div>
        </div>
        <div class="main-content">
            <nav class="navbar user-info-navbar" hidden></nav>

            <h1 id="catalogHeading">全部书库</h1>
            <p class="dl-sub">先选分类再加载。每本书两行：第一行书目信息，第二行简介自动折行。免费托管请走网站地址，不要双击 html。</p>

            <div class="dl-toolbar">
                <input type="search" id="nameFilter" placeholder="搜索书名 / 作者 / 标签" enterkeyhint="search">
                <select id="categoryFilter">
                    <option value="">选择分类</option>
                </select>
                <select id="ratingFilter">
                    <option value="">所有评分</option>
                    <option value="8-10">8 分及以上</option>
                    <option value="7-8">7–8 分</option>
                    <option value="6-7">6–7 分</option>
                    <option value="5-6">5–6 分</option>
                    <option value="0-5">5 分以下</option>
                </select>
            </div>
            <div id="catalogStatus" class="dl-count">正在载入…</div>
            <div id="catalogPicker" hidden></div>
            <div id="bookCards" class="dl-card-grid"></div>
            <div class="dl-pager">
                <button id="prevPage" class="dl-btn" type="button">上一页</button>
                <span id="pageInfo" class="dl-page-info"></span>
                <button id="nextPage" class="dl-btn" type="button">下一页</button>
            </div>

            <footer class="main-footer sticky footer-type-1">
                <div class="footer-inner">
                    <div class="footer-text">
                        &copy; 2017-2026
                        <a href="about.html"><strong>马克书库</strong></a>
                        by <strong>黑轻工作室</strong>
                    </div>
                    <div class="go-up">
                        <a href="#" rel="go-top"><i class="fa-angle-up"></i></a>
                    </div>
                </div>
            </footer>
        </div>
    </div>
    <script src="../assets/js/theme.js"></script>
    <script src="../assets/js/catalog.js"></script>
</body>

</html>
